<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f1">
  <meta name="description" content="Browse the Art Atlas comparison sets, the complete painting collection, and your own answered sets.">
  <title>Paintings · Art Atlas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./painting-gallery.css">
</head>
<body>
  <main id="painting-gallery"><p class="pg-loading">Loading paintings</p></main>
  <dialog id="painting-view" aria-labelledby="painting-title">
    <header class="pg-dialog-top"><p id="painting-position"></p><button type="button" data-close-painting aria-label="Close painting">×</button></header>
    <div class="pg-dialog-art"><img id="painting-image" alt=""></div>
    <div class="pg-dialog-caption"><div><h2 id="painting-title"></h2><p id="painting-artist"></p><p id="painting-institution"></p><a id="painting-source" target="_blank" rel="noopener noreferrer">Collection source ↗</a></div><nav aria-label="Browse paintings"><button type="button" data-painting-step="-1" aria-label="Previous painting">←</button><button type="button" data-painting-step="1" aria-label="Next painting">→</button></nav></div>
  </dialog>
  <noscript><p class="pg-loading">Enable JavaScript to browse the painting sets.</p></noscript>
  <script type="module" src="./painting-gallery.mjs"></script>
</body>
</html>
