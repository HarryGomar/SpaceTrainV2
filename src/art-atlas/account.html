<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f1">
  <title>Account saves · Art Atlas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/art-atlas/scrollbars.css">
  <link rel="stylesheet" href="./account.css">
</head>
<body>
  <main class="account-page">
    <header class="account-top">
      <a href="./">← Art Atlas</a>
      <button id="sign-out" type="button" hidden>Sign out</button>
    </header>

    <h1>Account saves</h1>
    <p class="account-intro">Art Atlas saves on this device as you go. Sign in to upload a copy and restore it on another device.</p>
    <p id="account-status" class="account-status" role="status">Opening account saves…</p>

    <button id="sign-in" class="account-google" type="button" hidden>
      <img src="/art-atlas/google-g.png" width="18" height="18" alt="">
      Continue with Google
    </button>

    <section id="signed-in" aria-label="Your saves" hidden>
      <p class="account-identity" id="identity"></p>
      <div id="saves"></div>
    </section>

    <footer class="account-footer"><a href="./privacy.html">Privacy and terms</a></footer>

    <template id="save-row">
      <article class="account-save">
        <div>
          <h2></h2>
          <p data-device></p>
          <p data-account></p>
        </div>
        <div class="account-actions">
          <button type="button" class="account-primary" data-save>Upload copy</button>
          <button type="button" data-restore>Restore here</button>
          <details class="account-options" hidden>
            <summary>Manage copies</summary>
            <div>
              <button type="button" data-recover>Restore previous device copy</button>
              <button type="button" data-remove>Delete uploaded copy</button>
            </div>
          </details>
        </div>
      </article>
    </template>
  </main>
  <script type="module" src="./account.mjs"></script>
</body>
</html>
